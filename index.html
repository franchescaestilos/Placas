<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<meta name="mobile-web-app-capable" content="yes">
<title>Registro de Placas</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<header><h1>Registro de Placas</h1></header>

<main>
  <section id="view-scan" class="view active">
    <h2>Registrar vehículo</h2>
    <div id="cam" class="cam">
      <video id="video" playsinline muted autoplay></video>
      <div id="frame" class="frame"></div>
      <div id="status" class="status">Cámara apagada</div>
      <div id="idle" class="idle">
        <button id="btnStart" class="btn primary big">📷 Escanear placa</button>
      </div>
    </div>
    <div id="camError" class="alert err" hidden></div>
    <button id="btnManual" class="link">Escribir placa manualmente</button>
  </section>

  <section id="view-list" class="view">
    <h2>Placas escaneadas</h2>
    <p id="total" class="total">Total de placas: …</p>
    <input id="search" type="search" placeholder="Buscar placa..." autocapitalize="characters" autocomplete="off">
    <button id="btnExport" class="btn dark">📥 Descargar Excel</button>
    <div id="listError" class="alert err" hidden></div>
    <ul id="list" class="list"></ul>
    <button id="btnMore" class="btn ghost" hidden>Cargar más</button>
  </section>
</main>

<div id="sheet" class="sheet">
  <p class="label">Placa detectada</p>
  <input id="plateInput" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false">
  <div id="dupWarn" class="alert warn" hidden></div>
  <button id="btnSave" class="btn primary big">Guardar placa</button>
  <button id="btnRetry" class="btn ghost">Escanear nuevamente</button>
</div>

<div id="confirm" class="modal" hidden>
  <div class="dialog" role="alertdialog" aria-labelledby="cTitle">
    <h3 id="cTitle">¿Eliminar esta placa?</h3>
    <p id="cPlate" class="cplate"></p>
    <p class="cnote">Esta acción no se puede deshacer.</p>
    <div class="cbtns">
      <button id="cCancel" class="btn ghost">Cancelar</button>
      <button id="cOk" class="btn danger">Eliminar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<nav>
  <button class="tab active" data-view="scan">📷 Escanear</button>
  <button class="tab" data-view="list">📋 Escaneados</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
